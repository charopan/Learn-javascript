<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My To-Do List</title>
  <style>
    /* ตกแต่งหน้าตาแบบง่ายๆ */
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
    button { cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📝 รายการสิ่งที่ต้องทำ</h2>
    
    <!-- 1. ช่องพิมพ์ข้อมูล -->
    <input type="text" id="todoInput" placeholder="พิมพ์รายการตรงนี้...">
    
    <!-- 2. ปุ่มกดเพิ่ม -->
    <button id="addBtn">เพิ่ม</button>

    <!-- 3. พื้นที่แสดงรายการ -->
    <ul id="todoList"></ul>
  </div>

  <!-- ดึง JavaScript มาทำงาน -->
  <script src="script.js"></script>
</body>
</html>
