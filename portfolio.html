<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โปรเจกต์รวม</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #000000;
    color: #fff;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
    padding: 40px 20px;
  }

  h2 {
    margin-bottom: 16px;
    font-size: 20px;
  }

  section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- สไตล์ของ Calculator --- */
  .calculator {
    background: #2b2b3d;
    padding: 24px;
    border-radius: 16px;
    width: 260px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #calcDisplay {
    width: 100%;
    height: 60px;
    font-size: 28px;
    text-align: right;
    padding: 8px 12px;
    box-sizing: border-box;
    border: none;
    border-radius: 8px;
    margin-bottom: 12px;
    background: #10101a;
    color: #fff;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .buttons button {
    height: 50px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #3d3d54;
    color: #fff;
    cursor: pointer;
  }
  .buttons button:hover { background: #4d4d6a; }
  .operator { background: #e08a45; }
  .operator:hover { background: #f09a55; }
  .equal { background: #4caf82; grid-column: span 2; }
  .equal:hover { background: #5cbf92; }
  .clear { background: #c0524f; }

  /* --- สไตล์ของ Fetch Demo --- */
  .fetch-box {
    width: 100%;
    max-width: 500px;
  }
  .fetch-box button {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #4caf82;
    color: #fff;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .fetch-box button:hover { background: #5cbf92; }
  #fetchResult {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .user-card {
    background: #2b2b3d;
    padding: 16px;
    border-radius: 10px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<!-- ส่วนที่ 1: Calculator -->
<section>
  <h2>เครื่องคิดเลข</h2>
  <div class="calculator">
    <input type="text" id="calcDisplay" value="0" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="pressKey('/')">÷</button>
      <button class="operator" onclick="pressKey('*')">×</button>
      <button class="operator" onclick="pressKey('-')">−</button>

      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button class="operator" onclick="pressKey('+')">+</button>

      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button onclick="pressKey('0')">0</button>

      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button onclick="pressKey('.')">.</button>

      <button class="equal" onclick="calculateResult()">=</button>
    </div>
  </div>
</section>

<!-- ส่วนที่ 2: Fetch Demo -->
<section>
  <h2>ดึงข้อมูลผู้ใช้จาก API</h2>
  <div class="fetch-box">
    <button id="loadFetchBtn" onclick="getUsers()">โหลดข้อมูล</button>
    <div id="fetchResult"></div>
  </div>
</section>

<!-- โหลดไฟล์ JS ของแต่ละส่วน -->
<script src="calculator2.js"></script>
<script src="fetch-demo2.js"></script>
</body>
</html>
