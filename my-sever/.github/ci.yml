name: ทดสอบโค้ดอัตโนมัติ

# ทำงานเมื่อไหร่: ทุกครั้งที่ push ขึ้น branch main
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ขั้นที่ 1: ดึงโค้ดจาก repo มาไว้ในเครื่องจำลอง
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      # ขั้นที่ 2: ติดตั้ง Node.js
      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ขั้นที่ 3: ติดตั้ง library ที่โปรเจกต์ต้องใช้
      - name: ติดตั้ง dependencies
        run: npm install

      # ขั้นที่ 4: รันคำสั่งทดสอบ (ตอนนี้แค่ log ข้อความไปก่อน)
      - name: ทดสอบเบื้องต้น
        run: node -e "console.log('โค้ดรันได้ปกติ ผ่านการทดสอบ')"